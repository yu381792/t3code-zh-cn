name: 中文版每日更新

on:
  schedule:
    # 北京时间每天 07:17；官方没有新变化时跳过构建。
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 合并官方 main（关闭时只构建当前中文版）
        type: boolean
        default: true
      force:
        description: 即使源码未变也重新发布
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-daily-desktop
  cancel-in-progress: false

jobs:
  release:
    # 免费方案仅在公开仓库运行，不使用付费的大型机器。
    if: github.repository == 'yu381792/t3code-zh-cn' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: yu381792/t3code-zh-cn
    steps:
      - name: 读取主线
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -b main FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 合并官方并判断是否需要构建
        id: source
        env:
          SYNC_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.sync_upstream }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: bash .github/scripts/prepare-fork-release.sh

      - name: 准备构建工具与依赖缓存
        if: steps.source.outputs.build == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: 安装桌面构建依赖
        if: steps.source.outputs.build == 'true'
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: 核对中文与线程菜单
        if: steps.source.outputs.build == 'true'
        run: |
          node scripts/check-interface-localization.mjs
          vp test run apps/web/src/i18n/translate.test.tsx apps/web/src/i18n/selectedValues.test.tsx apps/web/src/i18n/threadMenus.test.ts
          vp run --filter @t3tools/web --filter @t3tools/desktop typecheck
          node_modules/.bin/tsc --noEmit -p apps/server/tsconfig.json

      - name: 设置本次版本
        if: steps.source.outputs.build == 'true'
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          cp .env.example .env

      - name: 缓存原生资源监测程序
        if: steps.source.outputs.build == 'true'
        id: monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: fork-resource-monitor-arm64-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: 准备 Rust
        if: steps.source.outputs.build == 'true' && steps.monitor.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: 构建 Mac arm64 安装包
        if: steps.source.outputs.build == 'true'
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.monitor.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: bash .github/scripts/build-fork-desktop.sh

      - name: 发布经过构建检查的版本
        if: steps.source.outputs.build == 'true'
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream }}
        run: bash .github/scripts/publish-fork-release.sh

      - name: 失败说明
        if: failure()
        run: |
          echo '本次更新不通过。请查看失败步骤；上一版安装包继续保留。合并冲突需人工修复后重新运行。' >> "$GITHUB_STEP_SUMMARY"
